<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error Budget Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Inputs ── */
    .input-grid {
      display: grid;
      gap: 1.1rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="number"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus {
      border-color: #6366f1;
    }

    .unit {
      font-size: 0.9rem;
      color: #64748b;
      min-width: 2rem;
    }

    .hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 0.3rem;
    }

    /* ── Results ── */
    .result-grid {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .result-label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .result-value {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    /* ── Progress Bar ── */
    .progress-section {
      margin-bottom: 1.25rem;
    }

    .progress-track {
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background-color: #22c55e;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .bar-label {
      font-size: 0.78rem;
      color: #64748b;
      text-align: right;
    }

    /* ── Status Badge ── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1.5px solid currentColor;
      background: transparent;
      transition: color 0.3s, background-color 0.3s;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #334155;
      margin: 1.25rem 0;
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Error Budget Calculator</h1>
    <p class="subtitle">SLO に対するエラーバジェットをリアルタイムで計算します</p>

    <!-- 入力カード -->
    <div class="card">
      <div class="card-title">設定</div>
      <div class="input-grid">

        <div class="field">
          <label for="slo">SLO 目標</label>
          <div class="input-row">
            <input type="number" id="slo" value="99.9" min="0.001" max="99.999" step="0.001" />
            <span class="unit">%</span>
          </div>
          <div class="hint">例: 99.9 = "スリーナイン"</div>
        </div>

        <div class="field">
          <label for="window">計測期間</label>
          <div class="input-row">
            <input type="number" id="window" value="30" min="1" max="365" step="1" />
            <span class="unit">日</span>
          </div>
          <div class="hint">通常は 7 / 28 / 30 / 90 日</div>
        </div>

        <div class="field">
          <label for="downtime">累積ダウンタイム</label>
          <div class="input-row">
            <input type="number" id="downtime" value="0" min="0" step="1" />
            <span class="unit">分</span>
          </div>
          <div class="hint">今期に発生したダウンタイムの合計</div>
        </div>

      </div>
    </div>

    <!-- 結果カード -->
    <div class="card">
      <div class="card-title">エラーバジェット</div>

      <div class="result-grid">
        <div class="result-row">
          <span class="result-label">バジェット合計</span>
          <span id="total-budget" class="result-value">—</span>
        </div>
        <div class="result-row">
          <span class="result-label">使用済み</span>
          <span id="used-budget" class="result-value">—</span>
        </div>
        <div class="result-row">
          <span class="result-label">残り</span>
          <span id="remaining-budget" class="result-value">—</span>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div id="bar-fill" class="progress-fill"></div>
        </div>
        <div id="bar-label" class="bar-label">0% 使用</div>
      </div>

      <div class="divider"></div>

      <div id="status" class="status">—</div>
    </div>
  </div>

  <script src="dist/main.js"></script>
</body>
</html>
